name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Windows, Python 3.11)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install . pytest pytest-cov "html5lib>=1.1,<2" "pydot>=3,<4"
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build wheel
    runs-on: windows-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tool
        run: python -m pip install build
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: win-depends-wheel
          path: dist/*.whl
          retention-days: 7
