[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "win_depends"
version = "1.0.0"
description = "Windows DLL/EXE dependency tree and graph tool"
authors = ["Vorga"]
license = "MIT"
readme = "README.md"
packages = [{ include = "win_depends" }]

[tool.poetry.dependencies]
python = "^3.9"
tqdm = ">=4.64.1"
pefile = ">=2024.5.17"
networkx = ">=3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
black = "^24.0"
isort = "^5.0"
flake8 = "^6.0"
pre-commit = "^4.0"

[tool.poetry.scripts]
win_depends = "win_depends.cli:main"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "--cov=win_depends --cov-report=term-missing --cov-fail-under=80"
