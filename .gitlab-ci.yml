stages:
  - lint
  - test
  - build

variables:
  POETRY_VIRTUALENVS_CREATE: "false"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"

cache:
  key: "${CI_JOB_NAME}-${CI_COMMIT_REF_SLUG}-${PYTHON}"
  paths:
    - .cache/pypoetry
    - .cache/pip

.lint_template: &lint_definition
  stage: lint
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install poetry
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --no-ansi
  script:
    - poetry run black --check .
    - poetry run isort --check-only .
    - poetry run flake8

lint:
  <<: *lint_definition
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH

.test_template: &test_definition
  stage: test
  image: python:${PYTHON}
  parallel:
    matrix:
      - PYTHON: "3.9"
      - PYTHON: "3.10"
      - PYTHON: "3.11"
  before_script:
    - pip install --upgrade pip
    - pip install poetry
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --no-ansi
  script:
    - poetry run pytest -q --cov=win_depends --cov-fail-under=80
  artifacts:
    when: always
    paths:
      - htmlcov/
    expire_in: 1 week

test:
  <<: *test_definition

build:
  stage: build
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install poetry
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --no-ansi
  script:
    - poetry build -f wheel
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 1 week
